<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F6F7F4"><meta name="color-scheme" content="light"><meta name="apple-mobile-web-app-title" content="每日英文"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="icon.png"><style>body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style></head><body><title>每日英文</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column, one step on screen at a time, lyrics-style transcript with a highlighter marker on the line being spoken */
:root{
  /* 簡約淺灰綠，固定淺色（2026-11-12 Frank 選 B） */
  --bg:#F6F7F4; --surface:#FFFFFF; --ink:#2B312E; --muted:#636B65; --line:#E3E7E1;
  --accent:#5E8C7A; --accent-ink:#FFFFFF; --marker:#CFE3BF; --marker-ink:#2B312E;
  --good:#4F8A5B; --good-bg:#E6F1E2; --bad:#C0574B; --bad-bg:#F8E7E4;
  --font-display:"Atkinson Hyperlegible Next","Noto Sans TC",system-ui,-apple-system,sans-serif;
  --font-body:"Atkinson Hyperlegible Next","Noto Sans TC",system-ui,-apple-system,sans-serif;
  --r:14px; color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font:16px/1.55 var(--font-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{padding-top:18px;display:flex;flex-direction:column;gap:12px}
.eyebrow{font-size:14px;color:var(--muted);letter-spacing:.04em;display:flex;gap:8px;flex-wrap:wrap}
.eyebrow b{color:var(--ink);font-weight:600}
h1{font:700 28px/1.2 var(--font-display);letter-spacing:-.01em;margin:0;text-wrap:balance}
h1 small{display:block;font:500 15px/1.4 var(--font-body);color:var(--muted);margin-top:4px}
.hrow{display:flex;align-items:center;gap:10px}
.hrow .eyebrow{flex:1;min-width:0}
.hrow .streak{font-size:14px;white-space:nowrap}
.gear{flex:0 0 auto;width:44px;height:44px;margin:-10px -10px -10px 0;border:0;background:transparent;color:var(--muted);border-radius:50%;display:grid;place-items:center;cursor:pointer}
.gear[aria-expanded="true"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.settings{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px 14px;display:flex;flex-direction:column}
.settings .srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;flex-wrap:wrap}
.settings .srow + .srow{border-top:1px solid var(--line)}
.settings .srow small{display:block;font-size:13px;color:var(--muted)}
.streak{font-weight:600;font-variant-numeric:tabular-nums}
.week{display:flex;gap:6px;flex-wrap:wrap}
.wday{display:flex;flex-direction:column;align-items:center;gap:2px}
.wday small{font-size:13px;color:var(--muted);line-height:1.2}
.week span,.week button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:14px;color:var(--muted)}
.week .done{background:var(--good);border-color:var(--good);color:var(--bg)}
.week .half{background:linear-gradient(90deg,var(--good-bg) 50%,transparent 50%);border-color:var(--good);color:var(--ink)}
.week button{font:inherit;padding:0;background:transparent;cursor:pointer}
.week .today{border:2px solid var(--ink);color:var(--ink);font-weight:700}
.week .today.done{border-color:var(--ink)}
.toggle{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--muted);cursor:pointer;user-select:none;min-height:44px}
.toggle input{appearance:none;width:40px;height:24px;border-radius:12px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .2s}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);transition:transform .2s}
.toggle input:checked{background:var(--accent)}
.toggle input:checked::after{transform:translateX(16px)}
nav.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
nav.steps button{flex:0 0 auto;border:1.5px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:0 14px;min-height:44px;font:600 14px var(--font-body);cursor:pointer;white-space:nowrap}
nav.steps button.cur{border-color:var(--accent);color:var(--accent)}
nav.steps button.ok{background:var(--good-bg);border-color:transparent;color:var(--good)}
nav.steps button.skip{border-style:dashed;color:var(--muted);background:transparent}
/* 今日進度卡：做到第幾步、還剩多久、一鍵繼續 */
.skip-link{align-self:center;color:var(--muted)}
/* 完成頁的小慶祝 */
.done-hero{position:relative;overflow:hidden}
.badge{width:76px;height:76px;margin:0 auto;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;font-size:40px;font-weight:700;animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
.badge.part{background:var(--accent)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.burst i{position:absolute;left:50%;top:68px;width:8px;height:8px;border-radius:2px;opacity:0;animation:fly 1.1s ease-out .15s both}
@keyframes fly{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(260deg)}}
@media (prefers-reduced-motion:reduce){.badge,.burst i{animation:none!important}.burst{display:none}}
section.step{display:flex;flex-direction:column;gap:14px}
h2{font:700 22px/1.25 var(--font-display);margin:0}
.lead{color:var(--muted);margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
button.btn{font:700 16px var(--font-body);border-radius:12px;padding:12px 16px;min-height:48px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.player{display:flex;flex-direction:column;gap:12px}
.seek{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;cursor:pointer;--p:0%}
.seek::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--accent) var(--p),var(--line) var(--p))}
.seek::-moz-range-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--accent) var(--p),var(--line) var(--p))}
.seek::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.25);margin-top:-8px}
.seek::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent);border:3px solid var(--surface)}
.times{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.speed{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.speed button{border:0;background:transparent;color:var(--muted);font:600 15px var(--font-body);padding:0 14px;min-height:44px;cursor:pointer;font-variant-numeric:tabular-nums}
.speed button.on{background:var(--ink);color:var(--bg)}
.lyrics{position:relative;display:flex;flex-direction:column;gap:2px;max-height:52vh;overflow-y:auto;scroll-behavior:smooth;padding:6px 2px;overscroll-behavior:contain}
.ln{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:10px;cursor:pointer;color:var(--ink);font:inherit;display:grid;grid-template-columns:56px 1fr;gap:6px;transition:color .2s,background .2s}
.ln .who{font-size:13px;color:var(--muted);padding-top:4px}
.ln .en{font-size:17px;line-height:1.45}
.ln .zh{grid-column:2;font-size:14px;color:var(--muted)}
.lyrics .ln .en{color:color-mix(in srgb,var(--muted) 75%,transparent)}
.ln.now{background:color-mix(in srgb,var(--marker) 14%,transparent)}
.ln.now .en{color:color-mix(in srgb,var(--ink) 45%,transparent)}
.ln.now .w.on{color:var(--ink);font-weight:600;background:linear-gradient(transparent 58%,color-mix(in srgb,var(--marker) 70%,transparent) 58%);-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:color .12s}
.hidezh .zh{display:none}
.shadow-box{text-align:center;padding:22px 16px;gap:14px}
.shadow-box .big{font:600 21px/1.4 var(--font-body)}
.shadow-box .state{font-size:14px;font-weight:600;letter-spacing:.06em;color:var(--accent)}
.shadow-box .state.yours{color:var(--good)}
.cover{border:1.5px dashed var(--line);border-radius:var(--r);padding:28px 16px;text-align:center;color:var(--muted)}
.q{font-weight:600;font-size:17px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);text-align:left;border-radius:12px;padding:12px 14px;font:16px var(--font-body);cursor:pointer;display:flex;gap:10px}
.opt b{color:var(--muted);font-weight:600}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.right::after,.opt.wrong::after{margin-left:auto;padding-left:8px;font-weight:700;font-size:18px;line-height:1.2}
.opt.right::after{content:"✓";color:var(--good)}
.opt.wrong::after{content:"✗";color:var(--bad)}
.rz-chip.ok:not(:disabled)::after{content:" ✓"}
.rz-chip.bad::after{content:" ✗"}
.word{scroll-margin-top:12px}
.rated{font:600 14px var(--font-body);color:var(--muted);margin-left:8px;font-variant-numeric:tabular-nums;vertical-align:middle}
.rated.all{color:var(--good)}
/* 聽力：句子卡片、下面的句子、最下面的播放器；.nosub＝眼睛鍵把字幕藏起來 */
.lyr .subcover{display:none}
.lyr.nosub .subcover{display:block}
.lyr.nosub .lcard,.lyr.nosub .lnext{display:none}
.lcard{background:var(--surface);border:1.5px solid var(--accent);border-radius:var(--r);padding:12px 16px 6px;display:flex;flex-direction:column;gap:4px;min-height:132px}
.lcard .who{font-size:13px;color:var(--muted)}
.lcard .en{font:600 20px/1.45 var(--font-body);color:color-mix(in srgb,var(--ink) 38%,transparent)}
.lcard .en .w{transition:color .12s}
.lcard .en .w.on{color:var(--ink)}
.lcard .zh{font-size:15px;color:var(--muted)}
.lcard .acts{border-top:1px solid var(--line);margin-top:4px;padding-top:2px}
.lcard .acts .link{display:inline-flex;align-items:center;gap:4px;margin:0;padding:10px 0}
.lnext{overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:2px;margin-top:-4px}
.lnext .ln .en{font-size:17px;color:color-mix(in srgb,var(--ink) 55%,transparent)}
.lnext .ln.cur{display:none}
.lnext .ln.past{opacity:.45}
section.step.lyr{gap:10px}
.actionbar.tall{padding-top:8px}
.lplayer{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.lplayer .slimrow{display:flex;align-items:center;gap:12px}
.lplayer .slimrow .skip-link{flex:0 0 auto;margin:0}
.lplayer .slimrow .btn.slim{flex:1;min-height:40px;padding:6px 12px;font-size:15px}
.lplayer .seek{height:26px}
.lplayer .times{margin-top:-4px}
.lplayer .ctrl{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:4px}
.lplayer .ctrl .side{display:flex;justify-content:space-around;align-items:center;min-width:0}
.lplayer .ctrl .side .ibtn{min-width:44px}
.ibtn{min-width:52px;min-height:52px;border:0;background:transparent;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;font:600 16px var(--font-body);border-radius:12px}
.ibtn small{font-size:13px;font-weight:500;color:var(--muted)}
.ibtn .icon{width:24px;height:24px}
.ibtn[aria-pressed="false"] b{color:var(--muted);text-decoration:line-through}
.ibtn[aria-pressed="false"] .icon{color:var(--muted)}
.round{width:60px;height:60px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer}
.round .icon{width:28px;height:28px}
/* 回來接續的小視窗 */
dialog.welcome{border:0;border-radius:var(--r);padding:22px 20px 18px;width:min(340px,calc(100vw - 32px));background:var(--surface);color:var(--ink);box-shadow:0 12px 40px rgba(0,0,0,.18)}
dialog.welcome::backdrop{background:rgba(30,36,33,.35)}
dialog.welcome h3{font:700 20px var(--font-display);margin:0 0 6px}
dialog.welcome p{margin:0 0 4px}
dialog.welcome .sub{color:var(--muted);font-size:15px;margin-bottom:16px}
dialog.welcome .btn{width:100%}
dialog.welcome .link{display:block;margin:6px auto 0;text-align:center;color:var(--muted)}
.opt:disabled{cursor:default}
.explain{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.link{border:0;background:none;color:var(--accent);font:600 15px var(--font-body);padding:11px 0;margin:-8px 0;cursor:pointer;text-align:left}
.word{display:flex;flex-direction:column;gap:8px}
.word .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.word .w{font:700 24px var(--font-display)}
.wsay{align-self:center;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;width:44px;height:44px;display:grid;place-items:center;color:var(--accent);cursor:pointer;flex:0 0 auto}
.wsay .icon{width:22px;height:22px}
.word .pos{font-size:14px;color:var(--muted)}
.tag{font-size:13px;font-weight:600;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.word .zhm{font-weight:600}
.word .ex{font-size:15px}
.word .exzh{font-size:14px;color:var(--muted)}
.memo{display:flex;gap:8px}
.memo button{flex:1}
.memo button.picked-r{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.memo button.picked-f{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.icon{width:18px;height:18px;flex:0 0 auto}
textarea{width:100%;min-height:120px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:17px/1.5 var(--font-body);padding:12px;resize:vertical}
.pattern{font:700 19px var(--font-display);color:var(--accent)}
.fb{display:flex;flex-direction:column;gap:12px}
.fb .lbl{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.fb .said{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--bad) 60%,transparent)}
.fb .said.nostrike{text-decoration:none}
.fb .fixed{font-size:18px;font-weight:600;color:var(--good)}
.fb ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.fb ins{text-decoration:none;color:var(--good);font-weight:600}
.fb del{color:var(--bad)}
.note{font-size:14px;color:var(--muted)}
.score{font:700 40px var(--font-display);font-variant-numeric:tabular-nums}
.actionbar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.actionbar:has(.in:empty){display:none}
.actionbar .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.actionbar .btn{flex:1}
.done-hero{text-align:center;padding:30px 10px;gap:8px}
.rz-answer{min-height:56px;border:1.5px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rz-hint{color:var(--muted);font-size:14px;padding:0 4px}
.rz-bank{display:flex;flex-wrap:wrap;gap:8px}
.rz-chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 12px;font:500 16px var(--font-body);cursor:pointer}
.rz-chip.placed{border-color:var(--accent)}
.rz-chip.ok{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.rz-chip.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.rz-chip:disabled{cursor:default}
/* 卡通舞台：場景背景＋兩個人輪流說話（嘴型跟聲音、手勢、點頭、表情）*/
.vstage{position:relative;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:#111}
.vstage iframe,.vstage>div{position:absolute;inset:0;width:100%;height:100%;border:0}
.vsrc{font-size:13px;color:var(--muted);margin-top:8px}
.vsrc a{color:inherit}
#ytmini{position:fixed;right:12px;bottom:calc(var(--abh,96px) + 12px);width:min(240px,60vw);z-index:40;border-radius:12px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.25);background:#111}
#ytmini .vstage{border-radius:0}
#ytmini .x{position:absolute;top:4px;right:4px;z-index:2;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:16px;cursor:pointer}
.stage{position:relative;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:#ECEAE3 center/cover no-repeat}
.stage.small{aspect-ratio:2/1}
.toon{position:absolute;bottom:-5%;left:2%;width:47%;max-width:300px}
.toon.r{left:auto;right:2%}
.stage.small .toon{width:37%}
.toon svg{display:block;width:100%;height:auto;overflow:visible}
.toon.r svg{transform:scaleX(-1)}
.toon .nm{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.9);border-radius:999px;padding:1px 9px;font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap}
.toon.talk .nm{color:var(--accent)}
.toon .body{transform-box:view-box;transform-origin:80px 200px;transition:transform .4s}
.toon .head{transform-box:view-box;transform-origin:80px 114px;transition:rotate .4s}
.toon .gest{transform-box:view-box;transform-origin:125px 128px;transition:transform .35s}
.toon .mood{display:none}
.toon:not(.talk) .gest .hand{opacity:0}
.toon.m-neutral .mood.neutral,.toon.m-happy .mood.happy,.toon.m-surprised .mood.surprised,.toon.m-confused .mood.confused,.toon.m-sad .mood.sad{display:inline}
.toon .mo{display:none;transform-box:fill-box;transform-origin:center}
.toon.talk .mo{display:inline}
.toon .vis{display:none}
.toon.cue.talk .mo{display:none}
.toon.cue.talk[data-v="A"] .vis.A,.toon.cue.talk[data-v="B"] .vis.B,.toon.cue.talk[data-v="C"] .vis.C,.toon.cue.talk[data-v="D"] .vis.D,
.toon.cue.talk[data-v="E"] .vis.E,.toon.cue.talk[data-v="F"] .vis.F,.toon.cue.talk[data-v="G"] .vis.G,.toon.cue.talk[data-v="H"] .vis.H{display:inline}
.toon.cue.talk[data-v="X"] .shut{display:inline}
.toon.talk .shut{display:none}
.toon.talk:not(.lip) .mo{animation:yap .22s ease-in-out infinite alternate}
.toon.talk .body{transform:rotate(2.5deg)}
.toon.talk .head{animation:hbob .5s ease-in-out infinite alternate}
.toon.listen .head{animation:nod 2.2s ease-in-out infinite}
.toon.m-confused .head{rotate:-4deg}
.toon.m-sad .head{rotate:2.5deg}
.toon.talk.g1 .gest{animation:explain 1.1s ease-in-out infinite alternate}
.toon.talk.g2 .gest{animation:raise .9s ease-in-out infinite alternate}
.toon.talk.g3 .gest{animation:palm 1.4s ease-in-out infinite alternate}
.bubble{position:absolute;top:2%;left:72%;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:4px 10px;display:flex;gap:4px;opacity:0;transform:scale(.6);transition:opacity .15s,transform .15s}
.toon.r .bubble{left:auto;right:72%}
.toon.talk .bubble{opacity:1;transform:scale(1)}
.bubble i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:dot .9s infinite}
.bubble i:nth-child(2){animation-delay:.15s}.bubble i:nth-child(3){animation-delay:.3s}
@keyframes yap{from{transform:scaleY(.3)}to{transform:scaleY(1.2)}}

function lyricsList({ onPick }) {
  const box = h("div", { class: "lyrics", role: "list" });
  // 每個字估一個開始時間：照字母數分配整句的長度，標點後面多算一點停頓
  const words = L.lines.map((ln, i) => {
    const parts = ln.en.split(" ");
    const weight = (w) => w.replace(/[^A-Za-z0-9']/g, "").length + 1.5 + (/[,;]$/.test(w) ? 3 : 0) + (/[.!?]$/.test(w) ? 4 : 0);
    const totalW = parts.reduce((s, w) => s + weight(w), 0);
    if (T[i].w && T[i].w.length === parts.length) return parts.map((w, k) => ({ w, at: T[i].w[k] - (isVideo() ? L.video.start : 0) }));   // 影片字幕有每個字的真實時間
    let acc = 0;
    return parts.map((w) => { const at = T[i].start + (T[i].end - T[i].start) * acc / totalW; acc += weight(w); return { w, at }; });
  });
  L.lines.forEach((ln, i) => {
    const en = h("span", { class: "en" });
    words[i].forEach((x, k) => { if (k) en.append(" "); en.append(h("span", { class: "w" }, x.w)); });
    box.append(h("button", { class: "ln", role: "listitem", "data-i": i, onclick: () => onPick(i) },
      h("span", { class: "who" }, ln.s), en, h("span", { class: "zh" }, ln.zh)));
  });
  let last = -2, lastW = -1, needScroll = false, handsOffUntil = 0;
  // 手動拉字幕時，先停止自動跟隨；約 4 秒沒碰再接回正在播的那一句
  const handsOn = () => { handsOffUntil = Date.now() + 4000; needScroll = true; };
  ["touchmove", "wheel"].forEach(ev => box.addEventListener(ev, handsOn, { passive: true }));
  const mark = (i, t) => {
    if (i !== last) {
      if (last >= 0 && box.children[last]) box.children[last].querySelectorAll(".w.on").forEach(w => w.classList.remove("on"));
      last = i; lastW = -1; needScroll = true;
      [...box.children].forEach((el, j) => el.classList.toggle("now", j === i));
    }
    if (needScroll && Date.now() >= handsOffUntil) {
      needScroll = false;
      const el = box.children[i];
      if (el) box.scrollTo({ top: el.offsetTop - box.clientHeight / 2 + el.clientHeight / 2 });
    }
    if (i < 0) return;
    let k = -1;
    for (let n = 0; n < words[i].length; n++) if (t >= words[i][n].at) k = n;
    if (k !== lastW) {
      lastW = k;
      box.children[i].querySelectorAll(".w").forEach((w, n) => w.classList.toggle("on", n <= k));
    }
  };
  return { box, mark };
}

// 最下面的播放器（聽力頁）：進度條＋速度、字幕開關（眼睛）、上一句、播放、下一句、中文翻譯；ready／need 同 stepBar
function bottomPlayer(ready, need, { zh = true, eye = null } = {}) {
  const playFrom = (i) => { segEnd = null; segDone = null; stopAll(); dialogue.playbackRate = speed; dialogue.currentTime = T[i].start; dialogue.play().catch(() => {}); };
  const total = () => dialogue.duration || T[T.length - 1].end + 0.5;
  const seek = h("input", { type: "range", class: "seek", min: 0, max: Math.ceil(total() * 10), step: 1, value: 0, "aria-label": "拖曳調整播放位置" });
  const times = h("div", { class: "times" }, h("span", {}, "0:00"), h("span", {}, fmt(isVideo() ? dialogue.duration : T[T.length - 1].end)));
  let dragging = false;
  const paintBar = (t) => { seek.style.setProperty("--p", (100 * t / total()) + "%"); times.firstChild.textContent = fmt(t); };
  const seekTo = () => { segEnd = null; const t = seek.value / 10; dialogue.currentTime = t; paintBar(t); };
  seek.addEventListener("pointerdown", () => { dragging = true; });
  seek.addEventListener("touchstart", () => { dragging = true; }, { passive: true });
  seek.addEventListener("input", seekTo);
  seek.addEventListener("change", () => { seekTo(); dragging = false; });
  const play = h("button", { class: "round", "aria-label": "播放", onclick: () => {
    segEnd = null; segDone = null;
    if (dialogue.paused) { dialogue.playbackRate = speed; dialogue.play().catch(() => {}); } else dialogue.pause();
  } });
  const syncPlay = () => { play.innerHTML = ""; play.append(icon(dialogue.paused ? "play" : "pause")); play.setAttribute("aria-label", dialogue.paused ? "播放" : "暫停"); };
  syncPlay();
  const cur0 = () => Math.max(0, lineAt(dialogue.currentTime));
  // 上一句：這句已經播超過 1.5 秒 → 從這句開頭；否則跳到上一句
  const prev = h("button", { class: "ibtn", onclick: () => { const i = cur0(); playFrom(dialogue.currentTime - T[i].start > 1.5 || i === 0 ? i : i - 1); } }, icon("prev"), h("small", {}, "上一句"));
  const next = h("button", { class: "ibtn", onclick: () => playFrom(Math.min(cur0() + 1, L.lines.length - 1)) }, icon("next"), h("small", {}, "下一句"));
  const speeds = [0.75, 1, 1.25];
  const spd = h("button", { class: "ibtn", "aria-label": "播放速度", onclick: () => {
    speed = speeds[(speeds.indexOf(speed) + 1) % speeds.length]; store.set("speed", speed); dialogue.playbackRate = speed; spd.firstChild.textContent = speed + "x";
  } }, h("b", {}, speed + "x"), h("small", {}, "速度"));
  const zhb = h("button", { class: "ibtn", "aria-pressed": String(zhToggle.checked), onclick: () => {
    zhToggle.checked = !zhToggle.checked; store.set("zh", zhToggle.checked); applyZh(); zhb.setAttribute("aria-pressed", String(zhToggle.checked));
  } }, h("b", {}, "中"), h("small", {}, "翻譯"));
  listeners.add((t) => {
    seek.max = Math.ceil(total() * 10);
    if (!dragging) { seek.value = Math.round(t * 10); paintBar(t); }
    if (play.dataset.p !== String(dialogue.paused)) { play.dataset.p = String(dialogue.paused); syncPlay(); }
  });
  stepBar(ready, need, (skip, main) => {
    skip.className = "link skip-link"; main.classList.add("slim");
    return h("div", { class: "lplayer" },
      h("div", { class: "slimrow" }, skip, main),
      h("div", {}, seek, times),
      h("div", { class: "ctrl" }, h("div", { class: "side" }, spd, eye, prev), play, h("div", { class: "side" }, next, zh ? zhb : null)));   // 播放鍵固定在正中間
  });
  document.querySelector(".actionbar").classList.add("tall");
}

// 聽力（原「逐字聽」，2026-11-27 併入盲聽：眼睛鍵可以把字幕藏起來）：影片固定在上面；正在播的句子是一張卡片（可以點單字查意思）；下面是接下來的句子；播放器在最下面
VIEWS.lyrics = () => {
  dialogue.currentTime = 0;   // 一律從頭播
  // 每個字估一個開始時間：照字母數分配整句的長度，標點後面多算一點停頓
  const words = L.lines.map((ln, i) => {
    const parts = ln.en.split(" ");
    const weight = (w) => w.replace(/[^A-Za-z0-9']/g, "").length + 1.5 + (/[,;]$/.test(w) ? 3 : 0) + (/[.!?]$/.test(w) ? 4 : 0);
    const totalW = parts.reduce((a, w) => a + weight(w), 0);
    if (T[i].w && T[i].w.length === parts.length) return parts.map((w, k) => ({ w, at: T[i].w[k] - (isVideo() ? L.video.start : 0) }));   // 影片字幕有每個字的真實時間
    let acc = 0;
    return parts.map((w) => { const at = T[i].start + (T[i].end - T[i].start) * acc / totalW; acc += weight(w); return { w, at }; });
  });
  const playFrom = (i) => { segEnd = null; segDone = null; stopAll(); dialogue.playbackRate = speed; dialogue.currentTime = T[i].start; dialogue.play().catch(() => {}); };

  // 正在播的句子卡片
  const cWho = h("div", { class: "who" }), cEn = h("div", { class: "en lk" }), cZh = h("div", { class: "zh" });
  const card = h("div", { class: "lcard", "aria-live": "polite" }, cWho, cEn, cZh,
    h("div", { class: "acts" }, h("button", { class: "link", onclick: () => playLine(shown) }, icon("again"), " 重播這句")));
  let shown = -1;
  const showLine = (i) => {

    cEn.innerHTML = "";

    [...list.children].forEach((el, j) => { el.classList.toggle("cur", j === i); el.classList.toggle("past", j < i); });

  listeners.add((t) => {
    const i = Math.max(0, lineAt(t));
    if (i !== shown) { showLine(i); lastW = -1; }

    if (t >= T[i].start - 0.05) for (let n = 0; n < words[i].length; n++) if (t >= words[i][n].at) k = n;
    if (dialogue.currentTime >= T[i].end) k = words[i].length - 1;

  const WATCH_OK = 15 * 60, wkey = "watch:" + DAY;

  listeners.add(() => {
    const now = performance.now(), dt = Math.min((now - lastTick) / 1000, 1); lastTick = now;
    if (dialogue.paused) return;

  const sec = h("section", { class: "step lyr" },
    h("h2", {}, "看影片練聽力"),
    stageView({ small: true }), subcover, card, list);
  // 卡通＋句子卡＋下面的句子塞滿一個畫面：畫面捲到卡通上方，句子列表高度剛好到播放器上面

    if (fix > 80) list.style.height = list.style.maxHeight = fix + "px";
    needScroll = true; follow();
  };
  setTimeout(() => fitNow && fitNow(), 0);
  return sec;
};

// 一題句子重組。play：排對後播放正確句子；saveKey：記住做完沒
function reorderCard(item, n, saveKey, play, onSolved) {
  const saved = store.get(saveKey, {});
  const order = item.chunks.map((_, i) => i);
  let seed = n * 7 + 3 + item.chunks.length;
  for (let i = order.length - 1; i > 0; i--) { seed = (seed * 9301 + 49297) % 233280; const j = Math.floor(seed / 233280 * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  if (order.every((v, i) => v === i)) order.push(order.shift());
  let placed = [], tries = 0;
  const answer = h("div", { class: "rz-answer", "aria-label": "你的答案" });
  const bank = h("div", { class: "rz-bank" });
  const msg = h("div", { class: "explain" });
  const after = h("div", { class: "row", hidden: true }, h("button", { class: "btn", onclick: play }, icon("speaker"), "再聽一次"));
  function paint(state) {
    answer.innerHTML = ""; bank.innerHTML = "";
    if (!placed.length) answer.append(h("span", { class: "rz-hint" }, "點下面的字塊放到這裡"));
    placed.forEach((ci, pos) => answer.append(h("button", {
      class: "rz-chip placed" + (state === "check" ? (ci === pos ? " ok" : " bad") : "") + (state === "done" ? " ok" : ""),
      disabled: state === "done", onclick: () => { placed.splice(pos, 1); paint(); }
    }, item.chunks[ci])));
    order.filter(ci => !placed.includes(ci)).forEach(ci => bank.append(h("button", {
      class: "rz-chip", disabled: state === "done", onclick: () => { placed.push(ci); paint(); if (placed.length === item.chunks.length) check(); }
    }, item.chunks[ci])));
  }
  function check() {
    if (placed.every((ci, pos) => ci === pos)) return solved("答對了！");
    tries++;
    if (tries >= 2) { placed = item.chunks.map((_, i) => i); return solved("正確答案在上面，記一下順序。"); }
    paint("check");
    msg.textContent = "紅色的字塊位置不對，點它拿回來再試一次（再錯一次就會顯示答案）。";
  }
  function solved(text) {
    const s = store.get(saveKey, {}); s[n] = true; store.set(saveKey, s);
    paint("done"); msg.textContent = text + " 現在跟著念一次：";
    after.hidden = false; play(); onSolved && onSolved();
  }
  if (saved[n]) { placed = item.chunks.map((_, i) => i); paint("done"); msg.textContent = "已完成。"; after.hidden = false; }
  else paint();
  return h("div", { class: "card" }, h("div", { class: "q" }, `${n + 1}. ${item.zh}`), answer, bank, msg, after);
}

  const n = (k, arr) => arr.length - leftCount(arr, store.get(k + DAY, {}));
  if (id === "words") return `已評 ${n("memo:", L.words)}/${L.words.length} 個字`;
  if (id === "quiz") return `答了 ${n("quiz:", L.quiz)}/${L.quiz.length} 題`;
  return "";
}
function maybeWelcome() {
  if (MODE !== "lesson" || VIEW_DAY !== TODAY || DAY !== TODAY) return;
  if (!dayStarted(DAY) && !cur && !Object.keys(store.get("memo:" + DAY, {})).length) return;   // 今天還沒開始
  const t = cur < STEPS.length && !isHandled(STEPS[cur].id) ? cur : firstTodo();
  if (t >= STEPS.length) return;                        // 今天都處理完了
  const left = STEPS.filter(s => !isHandled(s.id));
  const detail = stepDetail(STEPS[t].id);
  const dlg = h("dialog", { class: "welcome", "aria-labelledby": "wb-title" },
    h("h3", { id: "wb-title" }, "歡迎回來"),
    h("p", {}, `上次做到 ${STEPS[t].name}` + (detail ? `（${detail}）` : "")),
    h("p", { class: "sub" }, `今天還剩 ${left.length} 步・約 ${left.reduce((a, s) => a + s.min, 0)} 分鐘`),
    h("button", { class: "btn primary", onclick: () => { dlg.close(); if (t !== cur) go(t); } }, `繼續：${STEPS[t].name}`),
    h("button", { class: "link", onclick: () => dlg.close() }, "先看看別的"));
  dlg.addEventListener("close", () => dlg.remove());
  document.body.append(dlg);
  try { dlg.showModal(); } catch { dlg.setAttribute("open", ""); }
}
// 切到別的 App 超過 10 分鐘再回來，也算「回來」
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (hiddenAt && Date.now() - hiddenAt > 10 * 60 * 1000 && !document.querySelector("dialog.welcome")) { stopAll(); maybeWelcome(); }
  hiddenAt = 0;
});

(async () => {
  try {
    INDEX = await fetchJSON("content/index.json");
    COMMON = await fetchJSON("content/common_gloss.json").catch(() => ({}));
    await openDay(TODAY);
    maybeWelcome();
  } catch (e) {
    $("#main").append(h("p", { class: "lead" }, "內容載入失敗，請檢查網路後重新整理。"));
  }
})();
</script>

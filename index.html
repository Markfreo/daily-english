<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F6F7F4"><meta name="color-scheme" content="light"><meta name="apple-mobile-web-app-title" content="每日英文"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="icon.png"><style>body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style></head><body><title>每日英文</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column, one step on screen at a time, lyrics-style transcript with a highlighter marker on the line being spoken */
:root{
  /* 簡約淺灰綠，固定淺色（2026-11-12 Frank 選 B） */
  --bg:#F6F7F4; --surface:#FFFFFF; --ink:#2B312E; --muted:#7D857F; --line:#E3E7E1;
  --accent:#5E8C7A; --accent-ink:#FFFFFF; --marker:#CFE3BF; --marker-ink:#2B312E;
  --good:#4F8A5B; --good-bg:#E6F1E2; --bad:#C0574B; --bad-bg:#F8E7E4;
  --font-display:"Inter","Noto Sans TC",system-ui,-apple-system,sans-serif;
  --font-body:"Inter","Noto Sans TC",system-ui,-apple-system,sans-serif;
  --r:14px; color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font:16px/1.55 var(--font-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{padding-top:18px;display:flex;flex-direction:column;gap:12px}
.eyebrow{font-size:13px;color:var(--muted);letter-spacing:.04em;display:flex;gap:8px;flex-wrap:wrap}
.eyebrow b{color:var(--ink);font-weight:600}
h1{font:700 28px/1.2 var(--font-display);letter-spacing:-.01em;margin:0;text-wrap:balance}
h1 small{display:block;font:500 15px/1.4 var(--font-body);color:var(--muted);margin-top:4px}
.statusrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.streak{font-weight:600;font-variant-numeric:tabular-nums}
.week{display:flex;gap:6px}
.week span,.week button{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:11px;color:var(--muted)}
.week .done{background:var(--good);border-color:var(--good);color:var(--bg)}
.week .half{background:linear-gradient(90deg,var(--good) 50%,transparent 50%);border-color:var(--good)}
.week button{font:inherit;padding:0;background:transparent;cursor:pointer}
.week .today{outline:2px solid var(--accent);outline-offset:2px}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{appearance:none;width:40px;height:24px;border-radius:12px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .2s}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);transition:transform .2s}
.toggle input:checked{background:var(--accent)}
.toggle input:checked::after{transform:translateX(16px)}
nav.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
nav.steps button{flex:0 0 auto;border:1.5px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:6px 12px;font:500 13px var(--font-body);cursor:pointer;white-space:nowrap}
nav.steps button.cur{border-color:var(--accent);color:var(--accent)}
nav.steps button.ok{background:var(--good-bg);border-color:transparent;color:var(--good)}
section.step{display:flex;flex-direction:column;gap:14px}
h2{font:700 22px/1.25 var(--font-display);margin:0}
.lead{color:var(--muted);margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
button.btn{font:600 15px var(--font-body);border-radius:12px;padding:12px 16px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.player{display:flex;flex-direction:column;gap:12px}
.seek{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;cursor:pointer;--p:0%}
.seek::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--accent) var(--p),var(--line) var(--p))}
.seek::-moz-range-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--accent) var(--p),var(--line) var(--p))}
.seek::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.25);margin-top:-8px}
.seek::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent);border:3px solid var(--surface)}
.times{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.speed{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.speed button{border:0;background:transparent;color:var(--muted);font:600 14px var(--font-body);padding:8px 12px;cursor:pointer;font-variant-numeric:tabular-nums}
.speed button.on{background:var(--ink);color:var(--bg)}
.lyrics{position:relative;display:flex;flex-direction:column;gap:2px;max-height:52vh;overflow-y:auto;scroll-behavior:smooth;padding:6px 2px;overscroll-behavior:contain}
.ln{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:10px;cursor:pointer;color:var(--ink);font:inherit;display:grid;grid-template-columns:56px 1fr;gap:6px;transition:color .2s,background .2s}
.ln .who{font-size:12px;color:var(--muted);padding-top:4px}
.ln .en{font-size:17px;line-height:1.45}
.ln .zh{grid-column:2;font-size:14px;color:var(--muted)}
.lyrics .ln .en{color:color-mix(in srgb,var(--muted) 75%,transparent)}
.ln.now{background:color-mix(in srgb,var(--marker) 14%,transparent)}
.ln.now .en{color:color-mix(in srgb,var(--ink) 45%,transparent)}
.ln.now .w.on{color:var(--ink);font-weight:600;background:linear-gradient(transparent 58%,color-mix(in srgb,var(--marker) 70%,transparent) 58%);-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:color .12s}
.hidezh .zh{display:none}
.shadow-box{text-align:center;padding:22px 16px;gap:14px}
.shadow-box .big{font:600 21px/1.4 var(--font-body)}
.shadow-box .state{font-size:14px;font-weight:600;letter-spacing:.06em;color:var(--accent)}
.shadow-box .state.yours{color:var(--good)}
.cover{border:1.5px dashed var(--line);border-radius:var(--r);padding:28px 16px;text-align:center;color:var(--muted)}
.q{font-weight:600;font-size:17px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);text-align:left;border-radius:12px;padding:12px 14px;font:16px var(--font-body);cursor:pointer;display:flex;gap:10px}
.opt b{color:var(--muted);font-weight:600}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.explain{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.link{border:0;background:none;color:var(--accent);font:600 14px var(--font-body);padding:0;cursor:pointer;text-align:left}
.word{display:flex;flex-direction:column;gap:8px}
.word .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.word .w{font:700 24px var(--font-display)}
.word .pos{font-size:13px;color:var(--muted)}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.word .zhm{font-weight:600}
.word .ex{font-size:15px}
.word .exzh{font-size:14px;color:var(--muted)}
.memo{display:flex;gap:8px}
.memo button{flex:1}
.memo button.picked-r{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.memo button.picked-f{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.icon{width:18px;height:18px;flex:0 0 auto}
textarea{width:100%;min-height:120px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:17px/1.5 var(--font-body);padding:12px;resize:vertical}
.pattern{font:700 19px var(--font-display);color:var(--accent)}
.fb{display:flex;flex-direction:column;gap:12px}
.fb .lbl{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.fb .said{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--bad) 60%,transparent)}
.fb .said.nostrike{text-decoration:none}
.fb .fixed{font-size:18px;font-weight:600;color:var(--good)}
.fb ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.fb ins{text-decoration:none;color:var(--good);font-weight:600}
.fb del{color:var(--bad)}
.note{font-size:13px;color:var(--muted)}
.score{font:700 40px var(--font-display);font-variant-numeric:tabular-nums}
.actionbar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.actionbar:has(.in:empty){display:none}
.actionbar .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.actionbar .btn{flex:1}
.done-hero{text-align:center;padding:30px 10px;gap:8px}
.rz-answer{min-height:56px;border:1.5px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rz-hint{color:var(--muted);font-size:14px;padding:0 4px}
.rz-bank{display:flex;flex-wrap:wrap;gap:8px}
.rz-chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 12px;font:500 16px var(--font-body);cursor:pointer}
.rz-chip.placed{border-color:var(--accent)}
.rz-chip.ok{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.rz-chip.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.rz-chip:disabled{cursor:default}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<div class="wrap" id="app">
  <header>
    <div class="eyebrow"><b id="h-date"></b><span id="h-theme"></span><span id="h-level"></span></div>
    <h1 id="h-title"></h1>
    <div class="statusrow">
      <span class="streak" id="streak"></span>
      <div class="week" id="week" aria-label="本週練習"></div>
      <label class="toggle" for="zh-toggle"><input type="checkbox" id="zh-toggle"> 中文</label>
    </div>
    <nav class="steps" id="steps" aria-label="今日步驟"></nav>
  </header>
  <main id="main"></main>
</div>
<div class="actionbar"><div class="in" id="actionbar"></div></div>

<script>
let L = null, T = [{ start: 0, end: 1 }], DAY = "", INDEX = [];
const url = (d, f) => `content/${d}/${f}`;
const fetchJSON = (u) => fetch(u, { cache: "no-cache" }).then(r => { if (!r.ok) throw new Error(u); return r.json(); });

// ---------- 小工具 ----------
const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null) el.append(c.nodeType ? c : document.createTextNode(c));
  return el;
};
const ICON = {
  play: '<svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l12-7z"/></svg>',
  pause: '<svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
  speaker: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>',
  again: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v4h4"/></svg>'
};
const icon = (name) => { const s = document.createElement("span"); s.innerHTML = ICON[name]; return s.firstChild; };
const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const store = {
  get(k, d) { try { const v = localStorage.getItem("fe:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("fe:" + k, JSON.stringify(v)); } catch {} }
};
const pad = (n) => String(n).padStart(2, "0");
const ymd = (dt) => `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`;
const parseD = (s) => new Date(s + "T00:00:00");
const addDays = (s, n) => { const x = parseD(s); x.setDate(x.getDate() + n); return ymd(x); };
const wdIdx = (s) => (parseD(s).getDay() + 6) % 7;           // 0 = 星期一
const monday = (s) => addDays(s, -wdIdx(s));
const WD = ["一", "二", "三", "四", "五", "六", "日"];
const mdLabel = (s) => { const x = parseD(s); return `${x.getMonth() + 1}/${x.getDate()}（${WD[wdIdx(s)]}）`; };
const TODAY = new URLSearchParams(location.search).get("today") || ymd(new Date());

// ---------- 音檔 ----------
const dialogue = new Audio();
dialogue.preload = "auto";
let clips = {};
const clip = (name) => (clips[name] ||= new Audio(name.includes("/") ? name : url(DAY, "audio/" + name + ".mp3")));
let speed = store.get("speed", 1);
function stopAll() { dialogue.pause(); Object.values(clips).forEach(a => a.pause()); }
function playClip(name) { stopAll(); const a = clip(name); a.currentTime = 0; a.play().catch(() => {}); }

// 播一段（某一句），播完自動停
let segEnd = null, segDone = null;
function playLine(i, onDone) {
  stopAll();
  dialogue.playbackRate = speed;
  dialogue.currentTime = T[i].start;
  segEnd = T[i].end + 0.05;
  segDone = onDone || null;
  dialogue.play().catch(() => {});
}
function tick() {
  if (segEnd != null && dialogue.currentTime >= segEnd) {
    dialogue.pause(); segEnd = null;
    const f = segDone; segDone = null; f && f();
  }
  listeners.forEach(fn => fn(dialogue.currentTime));
  requestAnimationFrame(tick);
}
const listeners = new Set();
requestAnimationFrame(tick);
const lineAt = (t) => { for (let i = T.length - 1; i >= 0; i--) if (t >= T[i].start - 0.05) return i; return -1; };

// ---------- 進度 ----------
const STEPS = [
  { id: "words", name: "單字預習" },
  { id: "blind", name: "① 盲聽" },
  { id: "quiz", name: "② 理解題" },
  { id: "lyrics", name: "③ 逐字聽" },
  { id: "shadow", name: "④ 跟讀" },
  { id: "speak", name: "⑤ 造句練習" },
  { id: "toeic", name: "⑥ 多益" }
];
let prog = {}, cur = 0, MODE = "lesson";
const progOf = (d) => store.get("prog:" + d, {});
const markDone = (id) => { prog[id] = true; store.set("prog:" + DAY, prog); renderNav(); renderStatus(); };
const allDone = () => STEPS.every(s => prog[s.id]);
// 某一天算不算「有練」：平日 6 步做完；週六複習做完；週日看過週報
const dayDone = (d) => { const p = progOf(d); return !!(p.review || p.report || STEPS.every(s => p[s.id])); };
const dayStarted = (d) => Object.keys(progOf(d)).length > 0;
function streakCount() {
  let n = 0; const miss = {}; const first = INDEX.length ? INDEX[0].date : TODAY;
  for (let i = 0; i < 400; i++) {
    const d = addDays(TODAY, -i);
    if (d < first) break;
    if (dayDone(d)) { n++; continue; }
    if (i === 0) continue;                       // 今天還沒做完不算斷
    if (wdIdx(d) >= 5) continue;                 // 週末沒做不算斷（做了會加天數）
    const wk = monday(d);
    if (!miss[wk]) { miss[wk] = 1; continue; }   // 每週可以休息 1 天
    break;
  }
  return n;
}
// 某一天要開哪一份課：當天有就用當天，沒有就用之前最近的一份
const lessonFor = (d) => { let e = null; for (const x of INDEX) if (x.date <= d) e = x; return e || INDEX[0]; };

const zhToggle = $("#zh-toggle");
zhToggle.checked = store.get("zh", false);
const applyZh = () => document.body.classList.toggle("hidezh", !zhToggle.checked);
zhToggle.addEventListener("change", () => { store.set("zh", zhToggle.checked); applyZh(); });
applyZh();

let VIEW_DAY = TODAY;
function renderHeader(title, sub, eyebrow) {
  $("#h-date").textContent = mdLabel(VIEW_DAY);
  $("#h-theme").textContent = eyebrow[0] || "";
  $("#h-level").textContent = eyebrow[1] || "";
  $("#h-title").innerHTML = "";
  $("#h-title").append(title, h("small", {}, sub));
}
function renderStatus() {
  const n = streakCount();
  $("#streak").textContent = n ? `連續 ${n} 天` : (MODE === "lesson" ? `今天 ${STEPS.filter(s => prog[s.id]).length}/${STEPS.length} 步` : "");
  const wk = $("#week"); wk.innerHTML = "";
  const mon = monday(TODAY);
  WD.forEach((lb, i) => {
    const d = addDays(mon, i);
    const canOpen = d <= TODAY && d >= addDays(TODAY, -6);
    const cls = [dayDone(d) ? "done" : dayStarted(d) ? "half" : "", d === VIEW_DAY ? "today" : ""].join(" ").trim();
    const el = h(canOpen ? "button" : "span", { class: cls, title: mdLabel(d) + (canOpen ? "，點一下打開" : ""), onclick: canOpen ? () => openDay(d) : null },
      dayDone(d) ? "✓" : lb);
    wk.append(el);
  });
}
function renderNav() {
  const nav = $("#steps"); nav.innerHTML = "";
  STEPS.forEach((s, i) => nav.append(h("button", {
    class: (i === cur ? "cur " : "") + (prog[s.id] ? "ok" : ""), onclick: () => go(i)
  }, s.name)));
  const b = nav.children[cur];
  if (b) nav.scrollLeft = b.offsetLeft - nav.clientWidth / 2 + b.clientWidth / 2;
}
function setBar(...btns) { const bar = $("#actionbar"); bar.innerHTML = ""; btns.forEach(b => bar.append(b)); }
const nextBtn = (label = "下一步") => h("button", { class: "btn primary", onclick: () => { markDone(STEPS[cur].id); go(cur + 1); } }, label);

function go(i) {
  stopAll(); listeners.clear(); segEnd = null; segDone = null;
  cur = Math.max(0, Math.min(i, STEPS.length));
  store.set("cur:" + DAY, cur);
  renderNav();
  const main = $("#main"); main.innerHTML = "";
  const view = cur === STEPS.length ? viewDone() : VIEWS[STEPS[cur].id]();
  main.append(view);
  window.scrollTo({ top: 0 });
}

// ---------- 各步驟 ----------
const VIEWS = {};

// ---------- 單字庫（跨天複習，存在這台裝置）----------
const bankGet = () => store.get("wordbank", {});
function registerWords() {
  const b = bankGet();
  L.words.forEach((w, i) => {
    if (!b[w.w]) b[w.w] = { w: w.w, pos: w.pos, zh: w.zh, ex2: w.ex2, ex2zh: w.ex2zh, toeic: w.toeic,
      from: DAY, audio: url(DAY, `audio/word_${i}.mp3`), stage: 0, due: null, done: false };
  });
  store.set("wordbank", b);
}
// 忘了 → 3 天後再出現；再忘 → 7 天；再忘 → 14 天。記得 → 不再出現
function rateWord(key, v) {
  const b = bankGet(), e = b[key]; if (!e) return;
  if (v === "r") { e.done = true; e.due = null; }
  else { e.due = addDays(TODAY, [3, 7, 14][Math.min(e.stage, 2)]); e.stage = Math.min(e.stage + 1, 2); e.done = false; }
  store.set("wordbank", b);
}
const dueWords = () => Object.values(bankGet()).filter(e => !e.done && e.due && e.due <= TODAY && e.from !== DAY).slice(0, 5);
function memoButtons(initial, onPick) {
  const r = h("button", { class: "btn" }, "記得"), f = h("button", { class: "btn" }, "忘了");
  const paint = (v) => { r.className = "btn" + (v === "r" ? " picked-r" : ""); f.className = "btn" + (v === "f" ? " picked-f" : ""); };

function playerControls({ showBar = true } = {}) {
  const playBtn = h("button", { class: "btn primary", onclick: () => {

  } }, v + "x")));
  const total = () => dialogue.duration || T[T.length - 1].end + 0.5;
  const bar = h("input", { type: "range", class: "seek", id: "seek", min: 0, max: Math.ceil(total() * 10), step: 1, value: 0, "aria-label": "拖曳調整播放位置" });

  const sync = () => { playBtn.innerHTML = ""; playBtn.append(icon(dialogue.paused ? "play" : "pause"), dialogue.paused ? "播放" : "暫停"); };
  sync();
  let dragging = false;
  const paintBar = (t) => { bar.style.setProperty("--p", (100 * t / total()) + "%"); times.firstChild.textContent = fmt(t); };
  const seekTo = () => { segEnd = null; const t = bar.value / 10; dialogue.currentTime = t; paintBar(t); };

  bar.addEventListener("input", seekTo);
  bar.addEventListener("change", () => { seekTo(); dragging = false; });
  listeners.add((t) => {
    bar.max = Math.ceil(total() * 10);
    if (!dragging) { bar.value = Math.round(t * 10); paintBar(t); }

function lyricsList({ onPick }) {
  const box = h("div", { class: "lyrics", role: "list" });
  // 每個字估一個開始時間：照字母數分配整句的長度，標點後面多算一點停頓
  const words = L.lines.map((ln, i) => {
    const parts = ln.en.split(" ");
    const weight = (w) => w.replace(/[^A-Za-z0-9']/g, "").length + 1.5 + (/[,;]$/.test(w) ? 3 : 0) + (/[.!?]$/.test(w) ? 4 : 0);
    const totalW = parts.reduce((s, w) => s + weight(w), 0);
    let acc = 0;
    return parts.map((w) => { const at = T[i].start + (T[i].end - T[i].start) * acc / totalW; acc += weight(w); return { w, at }; });
  });
  L.lines.forEach((ln, i) => {
    const en = h("span", { class: "en" });
    words[i].forEach((x, k) => { if (k) en.append(" "); en.append(h("span", { class: "w" }, x.w)); });
    box.append(h("button", { class: "ln", role: "listitem", "data-i": i, onclick: () => onPick(i) },
      h("span", { class: "who" }, ln.s), en, h("span", { class: "zh" }, ln.zh)));
  });
  let last = -2, lastW = -1;
  const mark = (i, t) => {
    if (i !== last) {
      if (last >= 0 && box.children[last]) box.children[last].querySelectorAll(".w.on").forEach(w => w.classList.remove("on"));
      last = i; lastW = -1;
      [...box.children].forEach((el, j) => el.classList.toggle("now", j === i));
      const el = box.children[i];
      if (el) box.scrollTo({ top: el.offsetTop - box.clientHeight / 2 + el.clientHeight / 2 });
    }
    if (i < 0) return;
    let k = -1;
    for (let n = 0; n < words[i].length; n++) if (t >= words[i][n].at) k = n;
    if (k !== lastW) {
      lastW = k;
      box.children[i].querySelectorAll(".w").forEach((w, n) => w.classList.toggle("on", n <= k));
    }
  };
  return { box, mark };
}

// 一題句子重組。play：排對後播放正確句子；saveKey：記住做完沒
function reorderCard(item, n, saveKey, play, onSolved) {
  const saved = store.get(saveKey, {});
  const order = item.chunks.map((_, i) => i);
  let seed = n * 7 + 3 + item.chunks.length;
  for (let i = order.length - 1; i > 0; i--) { seed = (seed * 9301 + 49297) % 233280; const j = Math.floor(seed / 233280 * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  if (order.every((v, i) => v === i)) order.push(order.shift());
  let placed = [], tries = 0;
  const answer = h("div", { class: "rz-answer", "aria-label": "你的答案" });
  const bank = h("div", { class: "rz-bank" });
  const msg = h("div", { class: "explain" });
  const after = h("div", { class: "row", hidden: true }, h("button", { class: "btn", onclick: play }, icon("speaker"), "再聽一次"));
  function paint(state) {
    answer.innerHTML = ""; bank.innerHTML = "";
    if (!placed.length) answer.append(h("span", { class: "rz-hint" }, "點下面的字塊放到這裡"));
    placed.forEach((ci, pos) => answer.append(h("button", {
      class: "rz-chip placed" + (state === "check" ? (ci === pos ? " ok" : " bad") : "") + (state === "done" ? " ok" : ""),
      disabled: state === "done", onclick: () => { placed.splice(pos, 1); paint(); }
    }, item.chunks[ci])));
    order.filter(ci => !placed.includes(ci)).forEach(ci => bank.append(h("button", {
      class: "rz-chip", disabled: state === "done", onclick: () => { placed.push(ci); paint(); if (placed.length === item.chunks.length) check(); }
    }, item.chunks[ci])));
  }
  function check() {
    if (placed.every((ci, pos) => ci === pos)) return solved("答對了！");
    tries++;
    if (tries >= 2) { placed = item.chunks.map((_, i) => i); return solved("正確答案在上面，記一下順序。"); }
    paint("check");
    msg.textContent = "紅色的字塊位置不對，點它拿回來再試一次（再錯一次就會顯示答案）。";
  }
  function solved(text) {
    const s = store.get(saveKey, {}); s[n] = true; store.set(saveKey, s);
    paint("done"); msg.textContent = text + " 現在跟著念一次：";
    after.hidden = false; play(); onSolved && onSolved();
  }
  if (saved[n]) { placed = item.chunks.map((_, i) => i); paint("done"); msg.textContent = "已完成。"; after.hidden = false; }
  else paint();
  return h("div", { class: "card" }, h("div", { class: "q" }, `${n + 1}. ${item.zh}`), answer, bank, msg, after);
}

  lessons.forEach(({ d: ld, L: x }) => {
    const qa = store.get("quiz:" + ld, {}), pa = store.get("p2:" + ld, {}), memo = store.get("memo:" + ld, {});
    x.quiz.forEach((q, i) => { if (qa[i] != null) { qAll++; if (qa[i] === q.answer) qOk++; } });
    x.part2.forEach((q, i) => { if (pa[i] != null) { pAll++; if (pa[i] === q.answer) pOk++; } });
    x.words.forEach((w, i) => { if (memo[i]) { learned++; if (memo[i] === "r") remembered++; else forgot.push(w.w); } });
  });
  const days = [0, 1, 2, 3, 4, 5].filter(i => dayDone(addDays(mon, i))).length;
  const pct = (a, b) => b ? Math.round(100 * a / b) + "%" : "還沒做";
  const todo = [0, 1, 2, 3, 4, 5].map(i => addDays(mon, i)).filter(x => x <= TODAY && x >= addDays(TODAY, -6) && !dayDone(x));
  setBar();
  return h("section", { class: "step" },
    h("h2", {}, `本週報告（${mdLabel(mon)}～${mdLabel(addDays(mon, 6))}）`),
    h("div", { class: "card" },
      h("div", {}, `練習天數：${days} / 6 天（連續 ${streakCount()} 天）`),
      h("div", {}, `單字：學了 ${learned} 個，記住 ${remembered} 個`),
      h("div", {}, `理解題答對率：${pct(qOk, qAll)}`),
      h("div", {}, `多益 Part 2 答對率：${pct(pOk, pAll)}`),
      forgot.length ? h("div", {}, `下週會再複習：${forgot.join("、")}`) : null),
    todo.length ? h("div", { class: "card" }, h("div", { class: "q" }, "這週還沒做完，可以補做："),
      h("div", { class: "row" }, ...todo.map(x => h("button", { class: "btn", onclick: () => openDay(x) }, mdLabel(x))))) : h("p", { class: "lead" }, "這週的練習都完成了，好好休息。"),
    h("p", { class: "note" }, "報告只用這台裝置上的紀錄計算。"));
}

// ---------- 打開某一天 ----------
async function openDay(d) {
  stopAll(); listeners.clear(); segEnd = null; segDone = null; clips = {};
  VIEW_DAY = d;
  const wd = wdIdx(d);
  const main = $("#main");
  if (wd >= 5) {
    MODE = wd === 5 ? "review" : "report";
    $("#steps").hidden = true;
    renderHeader(wd === 5 ? "Review Day" : "Weekly Report", wd === 5 ? "週六複習日：這週的單字和句子" : "週日：看看這週的成果", [wd === 5 ? "複習" : "週報", ""]);
    main.innerHTML = ""; main.append(h("p", { class: "lead" }, "載入中…"));
    const view = await (wd === 5 ? viewSaturday(d) : viewSunday(d));
    main.innerHTML = ""; main.append(view); renderStatus(); window.scrollTo({ top: 0 });
    return;
  }
  MODE = "lesson";
  $("#steps").hidden = false;
  const entry = lessonFor(d);
  DAY = entry.date;
  L = await fetchJSON(url(DAY, "lesson.json"));
  T = await fetchJSON(url(DAY, "timing.json"));
  dialogue.src = url(DAY, "audio/dialogue.mp3");
  prog = progOf(DAY); cur = store.get("cur:" + DAY, 0);
  renderHeader(L.title, L.titleZh + (DAY !== d ? `（${mdLabel(DAY)} 的內容）` : ""),
    [L.theme, `${L.level}・${L.speed}・約 ${Math.max(1, Math.round(T[T.length - 1].end / 60))} 分鐘`]);
  renderStatus();
  go(cur);
}

(async () => {
  try {
    INDEX = await fetchJSON("content/index.json");
    await openDay(TODAY);
  } catch (e) {
    $("#main").append(h("p", { class: "lead" }, "內容載入失敗，請檢查網路後重新整理。"));
  }
})();
</script>
